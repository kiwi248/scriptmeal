<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍳 AI 레시피 챗봇</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app">

  <!-- ── 사이드바 ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">🍳 레시피 챗봇</div>

    <hr class="sep" />

    <div class="sidebar-section">
      <span class="sidebar-label">응답 모드</span>
      <button class="mode-btn active" data-mode="agent" onclick="setMode('agent', this)">
        🤖 에이전트 (RAG + 웹서치)
      </button>
      <button class="mode-btn" data-mode="rag" onclick="setMode('rag', this)">
        📚 RAG 전용 (대화 이력 유지)
      </button>
    </div>

    <hr class="sep" />

    <div class="sidebar-section">
      <span class="sidebar-label">예시 질문</span>
      <ul class="example-list" id="exampleList">
        <li onclick="fillExample(this)">파스타 레시피 알려줘</li>
        <li onclick="fillExample(this)">최근 SNS에서 유행한 두바이 초콜릿 레시피</li>
        <li onclick="fillExample(this)">달걀 없이 만드는 케이크</li>
        <li onclick="fillExample(this)">30분 안에 만드는 간단한 저녁 메뉴</li>
        <li onclick="fillExample(this)">김치찌개 레시피 알려줘</li>
      </ul>
    </div>

    <hr class="sep" />

    <div class="sidebar-section">
      <button class="clear-btn" onclick="clearChat()">🗑️ 대화 초기화</button>
    </div>

    <hr class="sep" />

    <div class="sidebar-section">
      <span class="sidebar-label">API 상태</span>
      <div class="api-status" id="apiStatus">확인 중...</div>
    </div>
  </aside>

  <!-- ── 메인 영역 ── -->
  <main class="main">
    <div class="header">
      <h1>🍳 AI 레시피 챗봇</h1>
      <p>Food.com 레시피 DB + 실시간 웹서치로 최고의 레시피를 찾아드립니다.</p>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="empty-state" id="emptyState">
        <div class="icon">🍽️</div>
        <p>궁금한 레시피나 요리 방법을 질문해 보세요!</p>
      </div>
    </div>

    <div class="input-area">
      <textarea
        id="userInput"
        rows="1"
        placeholder="예: 파스타 레시피 알려줘 / 최근 유행하는 레시피는?"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">전송 ➤</button>
    </div>
  </main>

</div>

<script src="/static/app.js"></script>
</body>
</html>
